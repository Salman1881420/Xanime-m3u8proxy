<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamtape Direct Link Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h1>Streamtape Direct Link Generator</h1>
    <form id="form">
        <input type="text" id="api_key" placeholder="Enter Streamtape API Key" required><br>
        <input type="text" id="file_id" placeholder="Enter File ID" required><br>
        <button type="submit">Generate Direct Link</button>
    </form>
    <div class="error" id="error-message"></div>
    <div class="result" id="result"></div>
    <div class="player-container" id="player-container" style="display: none;">
        <h2>Video Player</h2>
        <video id="videoPlayer" controls>
            <source id="videoSource" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
